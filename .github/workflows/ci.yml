
name: QuantRisk CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore QuantRisk.slnx

      - name: Build solution
        run: dotnet build QuantRisk.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test QuantRisk.slnx --configuration Release --no-build --verbosity normal
